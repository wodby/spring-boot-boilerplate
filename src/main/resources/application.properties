spring.application.name=app

# Local defaults. On Wodby, the database link sets SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME
# and SPRING_DATASOURCE_PASSWORD, which take precedence over these values.
spring.datasource.url=jdbc:postgresql://localhost:5432/app
spring.datasource.username=app
spring.datasource.password=app

# Flyway creates and migrates the schema at startup; Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
